<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Business Catalog</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--bg:#F1F3F8;--card:#fff;--ink:#14172B;--mute:#5B6079;--line:#D9DDE8;--brand:#1F2A5C;--brand-ink:#fff;--sun:#E8B931;--wa:#128C4A;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1224;--card:#191D38;--ink:#EEF0F8;--mute:#9AA0BE;--line:#2B3057;--brand:#8E9CFF;--brand-ink:#0F1224;--sun:#E8B931;--wa:#25D366}}
  :root[data-theme="dark"]{--bg:#0F1224;--card:#191D38;--ink:#EEF0F8;--mute:#9AA0BE;--line:#2B3057;--brand:#8E9CFF;--brand-ink:#0F1224;--sun:#E8B931;--wa:#25D366}
  *,*::before,*::after{box-sizing:inherit}
  html{scroll-padding-top:env(safe-area-inset-top,0px)}
  body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 Figtree,system-ui,sans-serif}
  h1,h2,h3{font-family:"Bricolage Grotesque",Figtree,sans-serif;margin:0;line-height:1.1}
  button{font:inherit;color:inherit;cursor:pointer}
  :focus-visible{outline:3px solid var(--sun);outline-offset:2px}
  header{background:var(--brand);color:var(--brand-ink);padding:28px 20px 24px}
  .wrap{max-width:1000px;margin:0 auto}
  header h1{font-size:clamp(2rem,6vw,3.4rem);font-weight:800;letter-spacing:-.02em}
  header p{margin:8px 0 0;max-width:46ch;opacity:.85}
  .bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 20px}
  .bar .wrap{display:flex;gap:10px;align-items:center}
  .chips{display:flex;gap:8px;overflow-x:auto;flex:1;padding:2px}
  .chip{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:6px 14px;white-space:nowrap}
  .chip[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
  .cartbtn{background:var(--sun);color:#14172B;border:0;border-radius:12px;padding:9px 14px;font-weight:600;white-space:nowrap}
  main{padding:22px 20px 100px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:18px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
  .swatch{aspect-ratio:4/3;display:grid;place-items:center;font:800 2.6rem "Bricolage Grotesque",sans-serif;color:rgba(255,255,255,.92)}
  .info{padding:14px;display:flex;flex-direction:column;gap:4px;flex:1}
  .info h3{font-size:1.1rem}
  .info small{color:var(--mute)}
  .price{font-weight:600;margin-top:auto;padding-top:8px}
  .add{margin-top:8px;border:2px solid var(--brand);background:transparent;color:var(--brand);border-radius:10px;padding:8px;font-weight:600}
  .add:hover{background:var(--brand);color:var(--brand-ink)}
  .qty{display:flex;align-items:center;justify-content:space-between;margin-top:8px;border:2px solid var(--brand);border-radius:10px}
  .qty button{border:0;background:none;width:44px;height:38px;font-size:1.2rem;color:var(--brand)}
  .qty span{font-weight:600}
  dialog{border:0;padding:0;background:transparent;max-width:none;max-height:none;width:100%;height:100%;margin:0}
  dialog::backdrop{background:rgba(10,12,30,.55)}
  .sheet{position:fixed;right:0;top:0;bottom:0;width:min(440px,100%);background:var(--card);color:var(--ink);display:flex;flex-direction:column;padding:20px;padding-top:calc(20px + env(safe-area-inset-top,0px));padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));animation:slide .22s ease-out}
  @keyframes slide{from{transform:translateX(40px);opacity:0}}
  @media (prefers-reduced-motion:reduce){.sheet{animation:none}}
  .sheet header{background:none;color:inherit;padding:0 0 12px;display:flex;justify-content:space-between;align-items:center}
  .sheet h2{font-size:1.5rem}
  .x{border:0;background:none;font-size:1.6rem;width:44px;height:44px}
  .lines{flex:1;overflow:auto;border-top:1px solid var(--line)}
  .line{display:flex;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
  .line .n{flex:1}
  .line .n small{display:block;color:var(--mute)}
  .line .qty{margin:0;border-width:1px}
  .line .qty button{width:34px;height:32px}
  .empty{padding:40px 0;text-align:center;color:var(--mute)}
  .form{display:grid;gap:8px;padding-top:12px}
  input,textarea{width:100%;font:inherit;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
  .total{display:flex;justify-content:space-between;font-weight:600;font-size:1.15rem;padding:12px 0 4px}
  .send{display:block;text-align:center;text-decoration:none;background:var(--wa);color:#fff;border-radius:12px;padding:14px;font-weight:600;margin-top:8px}
  .send[aria-disabled="true"]{opacity:.4;pointer-events:none}
  .hint{font-size:.85rem;color:var(--mute);margin:6px 0 0}
</style>
</head>
<body>
<header><div class="wrap">
<h1>Business &amp; Co.</h1>
<p>Handmade textiles, soaps and home goods from Ibadan. Pick what you like and send your order on WhatsApp.</p>
</div></header>

<div class="bar"><div class="wrap">
<div class="chips" id="chips"></div>
<button class="cartbtn" id="open">Cart (<span id="count">0</span>)</button>
</div></div>

<main><div class="wrap"><div class="grid" id="grid"></div></div></main>

<dialog id="dlg"><div class="sheet">
<header><h2>Your order</h2><button class="x" id="close" aria-label="Close cart">&times;</button></header>
<div class="lines" id="lines"></div>
<div class="form">
<input id="name" placeholder="Your name" autocomplete="name">
<input id="addr" placeholder="Delivery address or pickup" autocomplete="street-address">
<textarea id="note" rows="2" placeholder="Note to seller (optional)"></textarea>
</div>
<div class="total"><span>Total</span><span id="total">₦0</span></div>
<a class="send" id="send" href="#" target="_blank" rel="noopener" aria-disabled="true">Send order on WhatsApp</a>
<p class="hint">WhatsApp opens with your order written out. Payment and delivery are agreed in the chat.</p>
</div></dialog>

  <script>
    // ===== EDIT THESE =====
    const SELLER_NUMBER = "2347043420968"; 
    const STORE = "Business Co.";
    const CURRENCY = "₦";
    const PRODUCTS = [
    {id:1,name:"Indigo adire fabric",desc:"2 yards, hand-dyed cotton",price:12000,cat:"Textiles",color:"#1F2A5C"},
    {id:2,name:"Tie-dye headwrap",desc:"Ready-tied gele style",price:4500,cat:"Textiles",color:"#3B5BA9"},
    {id:3,name:"Adire tote bag",desc:"Lined, zip pocket",price:8500,cat:"Bags",color:"#2C3E7A"},
    {id:4,name:"Raffia market basket",desc:"Woven, leather handles",price:9000,cat:"Bags",color:"#A8742A"},
    {id:5,name:"Black soap bar",desc:"Traditional, 200g",price:1800,cat:"Soaps",color:"#3A2A22"},
    {id:6,name:"Shea butter jar",desc:"Unrefined, 250g",price:3500,cat:"Soaps",color:"#B9922E"},
    {id:7,name:"Cushion cover",desc:"45×45cm adire print",price:5500,cat:"Home",color:"#4A6FB5"},
    {id:8,name:"Table runner",desc:"Indigo, 180cm",price:7000,cat:"Home",color:"#233470"}
    ];
    // ======================
    const $=id=>document.getElementById(id);
    const fmt=n=>CURRENCY+n.toLocaleString("en-NG");
    let cart={},cat="All";
    try{cart=JSON.parse(localStorage.getItem("cart")||"{}")||{}}catch(e){cart={}}
    const save=()=>{try{localStorage.setItem("cart",JSON.stringify(cart))}catch(e){}};
    const cats=["All",...new Set(PRODUCTS.map(p=>p.cat))];

    function chips(){$("chips").innerHTML=cats.map(c=>`<button class="chip" aria-pressed="${c===cat}" data-c="${c}">${c}</button>`).join("")}
    function grid(){
    $("grid").innerHTML=PRODUCTS.filter(p=>cat==="All"||p.cat===cat).map(p=>{
      const q=cart[p.id]||0;
      return `<article class="card"><div class="swatch" style="background:${p.color}" aria-hidden="true">${p.name[0]}</div>
      <div class="info"><h3>${p.name}</h3><small>${p.desc}</small><div class="price">${fmt(p.price)}</div>
      ${q?`<div class="qty"><button data-d="-1" data-id="${p.id}" aria-label="Remove one ${p.name}">−</button><span>${q}</span><button data-d="1" data-id="${p.id}" aria-label="Add one ${p.name}">+</button></div>`
        :`<button class="add" data-d="1" data-id="${p.id}">Add to cart</button>`}</div></article>`}).join("");
    }
    function items(){return PRODUCTS.filter(p=>cart[p.id]).map(p=>({...p,q:cart[p.id]}))}
    function total(){return items().reduce((s,i)=>s+i.q*i.price,0)}
    function message(){
    const it=items(),n=$("name").value.trim(),a=$("addr").value.trim(),no=$("note").value.trim();
    let m=`Hello ${STORE}, I'd like to order:\n\n`;
    it.forEach(i=>{m+=`• ${i.q} × ${i.name} — ${fmt(i.q*i.price)}\n`});
    m+=`\nTotal: ${fmt(total())}`;
    if(n)m+=`\nName: ${n}`;
    if(a)m+=`\nDelivery/pickup: ${a}`;
    if(no)m+=`\nNote: ${no}`;
    return m+`\n\nPlease confirm availability and payment details. Thank you!`;
    }
    function cartUI(){
    const it=items(),cnt=it.reduce((s,i)=>s+i.q,0);
    $("count").textContent=cnt;
    $("total").textContent=fmt(total());
    $("lines").innerHTML=it.length?it.map(i=>`<div class="line"><div class="n">${i.name}<small>${fmt(i.price)} each</small></div>
      <div class="qty"><button data-d="-1" data-id="${i.id}" aria-label="Remove one ${i.name}">−</button><span>${i.q}</span><button data-d="1" data-id="${i.id}" aria-label="Add one ${i.name}">+</button></div></div>`).join("")
      :`<div class="empty">Your cart is empty.<br>Add something from the catalog.</div>`;
    const s=$("send");
    s.setAttribute("aria-disabled",it.length?"false":"true");
    s.href=it.length?`https://wa.me/${SELLER_NUMBER}?text=${encodeURIComponent(message())}`:"#";
    }
    function change(id,d){
    const q=(cart[id]||0)+d;
    if(q<=0)delete cart[id];else cart[id]=q;
    save();grid();cartUI();
    }
    document.addEventListener("click",e=>{
    const b=e.target.closest("button");if(!b)return;
    if(b.dataset.id)change(+b.dataset.id,+b.dataset.d);
    else if(b.dataset.c){cat=b.dataset.c;chips();grid()}
    });
    ["name","addr","note"].forEach(id=>$(id).addEventListener("input",cartUI));
    $("open").onclick=()=>$("dlg").showModal();
    $("close").onclick=()=>$("dlg").close();
    $("dlg").addEventListener("click",e=>{if(e.target===$("dlg"))$("dlg").close()});
    chips();grid();cartUI();
  </script>
</body>
</html>
