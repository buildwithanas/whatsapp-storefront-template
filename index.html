<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Adire &amp; Co. Catalog</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="hero"><div class="wrap">
  <h1>Adire &amp; Co.</h1>
  <p>Handmade textiles, soaps and home goods from Ibadan. Pick what you like and send your order on WhatsApp.</p>
</div></header>

<div class="bar"><div class="wrap">
  <div class="chips" id="chips"></div>
  <button class="cartbtn" id="open">Cart (<span id="count">0</span>)</button>
</div></div>

<main><div class="wrap"><div class="grid" id="grid"></div></div></main>

<dialog id="dlg"><div class="sheet">
  <header><h2>Your order</h2><button class="x" id="close" aria-label="Close cart">&times;</button></header>
  <div class="lines" id="lines"></div>
  <div class="form">
    <input id="name" placeholder="Your name" autocomplete="name">
    <input id="addr" placeholder="Delivery address or pickup" autocomplete="street-address">
    <textarea id="note" rows="2" placeholder="Note to seller (optional)"></textarea>
  </div>
  <div class="total"><span>Total</span><span id="total"></span></div>
  <a class="send" id="send" href="#" target="_blank" rel="noopener" aria-disabled="true">Send order on WhatsApp</a>
  <p class="hint">WhatsApp opens with your order written out. Payment and delivery are agreed in the chat.</p>
</div></dialog>

<script src="script.js"></script>
</body>
</html>
